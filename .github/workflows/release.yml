name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            # Builds all platforms, writes checksums.txt, publishes the GitHub
            # Release, and commits Formula/think-better.rb and
            # bucket/think-better.json back to main (Homebrew tap + Scoop bucket).
            # Uses the built-in GITHUB_TOKEN; if main is protected, allow
            # github-actions to bypass the rule or the commit will be rejected.
            - uses: goreleaser/goreleaser-action@v6
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
