name: Release

on:
    push:
        tags:
            - "v*"
    # Release without pushing a tag yourself: Actions → Release → Run workflow,
    # enter the version (e.g. v1.1.0). The tag is created on the current main.
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag to create and release, e.g. v1.1.0"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # Tags pushed with GITHUB_TOKEN do not trigger another run, so this
            # job does not release twice.
            - name: Create tag (manual run)
              if: github.event_name == 'workflow_dispatch'
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                    echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
                    exit 1
                  fi
                  if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                    echo "::error::tag $VERSION already exists"
                    exit 1
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "$VERSION" -m "$VERSION"
                  git push origin "refs/tags/$VERSION"

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            # Builds all platforms, writes checksums.txt, publishes the GitHub
            # Release, and commits Formula/think-better.rb and
            # bucket/think-better.json back to main (Homebrew tap + Scoop bucket).
            # Uses the built-in GITHUB_TOKEN; if main is protected, allow
            # github-actions to bypass the rule or the commit will be rejected.
            - uses: goreleaser/goreleaser-action@v6
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
