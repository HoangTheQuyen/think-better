name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            # Builds all platforms, writes checksums.txt, publishes the GitHub
            # Release, and updates the Homebrew tap and Scoop bucket.
            # TAP_GITHUB_TOKEN: a fine-grained PAT with "Contents: read & write"
            # on HoangTheQuyen/homebrew-tap and HoangTheQuyen/scoop-bucket.
            # Without it the release still ships; only tap/bucket updates are skipped.
            - uses: goreleaser/goreleaser-action@v6
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
