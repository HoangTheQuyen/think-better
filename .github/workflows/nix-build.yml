name: Nix Build

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow calls this to gate a release on the Nix build.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A plain "${{ github.workflow }}" group would be the same group as the CI
  # call from the Release workflow (same caller name, same ref), so the two
  # could queue behind each other instead of running in parallel.
  group: nix-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix build
      - name: Version matches the VERSION file
        run: |
          ./result/bin/think-better version
          ./result/bin/think-better version | grep -F "v$(cat VERSION)"
