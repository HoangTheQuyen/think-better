name: PR title

# Pull requests are usually squash-merged, so the PR title becomes the commit
# message that the release changelog groups by (feat / fix / docs / ...).
# pull_request_target only reads the title; it never checks out PR code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md ("Commits and pull requests").
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            perf
            build
            style
            revert
          requireScope: false
