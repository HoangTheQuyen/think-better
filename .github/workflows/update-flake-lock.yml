name: Update flake.lock

# Monthly PR that bumps the nixpkgs / flake-utils pins in flake.lock.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General). PRs opened with GITHUB_TOKEN do not start
# other workflows, so close and reopen the PR (or push to its branch) to run
# CI and the Nix build on it before merging.
on:
  schedule:
    - cron: "23 5 1 * *" # 05:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'HoangTheQuyen/think-better'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the flake.lock branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore(nix): update flake.lock"
          commit-msg: "chore(nix): update flake.lock"
          pr-labels: |
            dependencies
