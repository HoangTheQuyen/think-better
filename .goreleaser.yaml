# GoReleaser config - builds release binaries, archives, checksums, SBOMs and
# a cosign signature, uploads them to a draft GitHub Release, and writes the
# Homebrew formula and Scoop manifest to dist/. The Release workflow
# (.github/workflows/release.yml) then attests the assets, commits the formula
# (Formula/) and manifest (bucket/) back into this repository, so it doubles
# as the tap and the bucket, and publishes the release as its last step.
#
# Docs: https://goreleaser.com
# Local dry run: make release-snapshot (goreleaser release --snapshot --clean --skip=sign)
#
# GoReleaser version: pinned to an exact release in .github/workflows/release.yml
# and ci.yml (GORELEASER_VERSION). Keep them in sync when bumping.
#
# Why `brews` and not `homebrew_casks`: GoReleaser deprecated `brews` in
# favour of casks, so `goreleaser check` exits 2 ("valid, but uses deprecated
# properties"); `goreleaser release` still works and only warns. Switching to
# a cask would change things for users:
#   - `brew upgrade` does not move an installed formula to a cask, so existing
#     users would silently stay on the last formula release;
#   - casks of an unsigned, un-notarized binary get the macOS quarantine flag
#     (Gatekeeper blocks the first run unless we strip it in a hook);
#   - casks on Linux need a recent Homebrew, while the formula works today.
# So we keep the formula (Formula/think-better.rb, installed with
# `brew install HoangTheQuyen/think-better/think-better`), pin GoReleaser to an
# exact version that still supports `brews`, and CI accepts exit code 2 from
# `goreleaser check` only when `brews` is the sole deprecation
# (scripts in .github/workflows/ci.yml). Revisit before GoReleaser v3.
version: 2

project_name: think-better

# The Release workflow already ran the full CI suite (vet, tests, lint, Python
# tests) on this commit; this keeps local `make release-snapshot` honest too.
before:
  hooks:
    - go test ./...

builds:
  - id: think-better
    main: ./cmd/think-better
    binary: think-better
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Reproducible builds: no wall-clock time anywhere in the output. The
    # binary's mtime and its build date both come from the tagged commit.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .ShortCommit }} -X main.buildDate={{ slice .CommitDate 0 10 }}

archives:
  # Raw binaries named think-better-<os>-<arch>[.exe]: the assets that
  # install.sh / install.ps1 download. Keep these names stable.
  - id: raw
    ids: [think-better]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

  # Compressed archives for package managers (Homebrew, Scoop).
  - id: packaged
    ids: [think-better]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

# One SPDX SBOM per packaged archive (needs syft on PATH).
sboms:
  - artifacts: archive
    ids: [packaged]

# Keyless cosign signature of checksums.txt (which covers every asset),
# using the workflow's GitHub OIDC identity. Produces checksums.txt.sigstore.json.
# Verify: see SECURITY.md. Skipped in snapshots (--skip=sign).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "^chore\\(brew\\)"
      - "^chore\\(scoop\\)"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]./-]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]./-]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]./-]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: HoangTheQuyen
    name: think-better
  # Keep the release a draft: the Release workflow publishes it only after
  # every later step (attestations, Formula/bucket commits) has succeeded,
  # so a failed run never leaves a half-published release. Drafts are not
  # "latest", so install.sh / install.ps1 keep installing the previous one.
  draft: true
  # A re-run after a failure replaces the draft that run left behind.
  replace_existing_draft: true
  header: |
    ## Install or upgrade

    **macOS / Linux**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/HoangTheQuyen/think-better/main/install.sh | THINK_BETTER_VERSION={{ .Tag }} sh
    # Homebrew: brew install HoangTheQuyen/think-better/think-better   (upgrade: brew upgrade think-better)
    ```

    **Windows (PowerShell)**
    ```powershell
    $env:THINK_BETTER_VERSION = "{{ .Tag }}"; irm https://raw.githubusercontent.com/HoangTheQuyen/think-better/main/install.ps1 | iex
    # Scoop: scoop bucket add think-better https://github.com/HoangTheQuyen/think-better; scoop install think-better   (upgrade: scoop update think-better)
    ```

    **Go**: `go install github.com/HoangTheQuyen/think-better/cmd/think-better@{{ .Tag }}`

    Then, in your project: `think-better init --ai claude` (or `copilot`, `antigravity`, `opencode`). Skill scripts need Python 3 (`think-better check`).

    **Verify a download**: `gh attestation verify <file> --repo HoangTheQuyen/think-better` (details in [SECURITY.md](https://github.com/HoangTheQuyen/think-better/blob/main/SECURITY.md#verifying-releases)).

# Homebrew:
#   brew install HoangTheQuyen/think-better/think-better
#   (or: brew tap HoangTheQuyen/think-better https://github.com/HoangTheQuyen/think-better && brew install think-better)
brews:
  - name: think-better
    ids: [packaged]
    repository:
      owner: HoangTheQuyen
      name: think-better
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://thinkbetter.dev/
    description: Structured decision-making and problem-solving skills for AI coding assistants
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    # Written to dist/homebrew/Formula/ only: the Release workflow commits it
    # (.github/scripts/publish-package-manifests.sh) once the release assets
    # it points at are uploaded, and not for pre-releases (e.g. v1.2.0-rc1).
    skip_upload: true
    commit_msg_template: "chore(brew): update formula to {{ .Tag }}"
    test: |
      assert_match version.to_s, shell_output("#{bin}/think-better version")
    caveats: |
      Install skills in your project with:
        think-better init --ai claude   # or: copilot, antigravity, opencode
      The skill scripts need Python 3 (check with: think-better check).

# Scoop:
#   scoop bucket add think-better https://github.com/HoangTheQuyen/think-better
#   scoop install think-better
scoops:
  - name: think-better
    ids: [packaged]
    repository:
      owner: HoangTheQuyen
      name: think-better
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://thinkbetter.dev/
    description: Structured decision-making and problem-solving skills for AI coding assistants
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore(scoop): update manifest to {{ .Tag }}"
    # Written to dist/scoop/bucket/ only; committed by the Release workflow
    # like the Homebrew formula above.
    skip_upload: true
    # GoReleaser has no `notes` field for Scoop; print the hint after install.
    post_install:
      - "Write-Host 'think-better skill scripts need Python 3 (e.g. scoop install python). Check with: think-better check'"
